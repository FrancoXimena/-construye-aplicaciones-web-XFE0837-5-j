<!DOCTYPE html> <!--le indica al navegador web que version de html se esta usando-->
<html lang="en"> <!--para indicar el idioma principal de la pagina web-->

<head> <!--guarda informacion tecnica y metadatos sobre una pagina web-->
    <meta charset="UTF-8"> <!--responde preguntas en timepo real,crea imagenes apartir de texto y redacta contenido-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--responde preguntas en timepo real,crea imagenes apartir de texto y redacta contenido-->
    <title>parrafos HTML </title> <!--muetra el titulo de la pagina web-->
</head>  <!--el cierre del encabezado-->

<body> <!--muestra el contenido visual y estructurado que se muestra en la pagina web-->
    <h1>estructura de html</h1> <!--define el titulo inicial del contenido-->
    <h2>html </h2> <!--subtitulo del contenido-->
    <p>envuelve todo el contenido de la pagina</p> <!--define los parrafos de la pagina web-->
    <h2>head</h2> <!--subtitulo del contenido-->
    <p>contiene los metadatos del sitio web,configuraciones y el titulo de la pestaña</p> <!--define los parrafos de la pagina web -->
    <h2>body</h2> <!--subtitulo del contenido-->
    <p>muestra los elementos visuales que ve el usuario</p> <!--define los parrafos de la pagina web-->
    <h2>footer</h2> <!--representa el pie de pagina-->
    <p>muestra la informacion del autor de la pagina,creditos, informacion relevante,etc.</p> <!--define los parrafos de la pagina web-->
</body> <!--el cierre del body-->
</html> <!--el cierre del html-->
